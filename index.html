<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e6e6e6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Error Screen</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;background:#e6e6e6}
.app{width:100%;height:100dvh;background:#e6e6e6;display:flex;align-items:center;justify-content:center}

/* The panel and every element scale from the reference proportions,
   so the same visual proportions are retained on small and large phones. */
.panel{
  width:70vw;
  max-width:500px;
  aspect-ratio:1.47/1;
  max-height:31vh;
  min-width:285px;
  min-height:194px;
  background:#fff;
  border-radius:clamp(30px,5.4vw,42px);
  position:relative;
  padding:clamp(30px,6.7vw,48px) clamp(26px,5.6vw,40px);
}
.warning{
  position:absolute;
  top:16%;
  left:50%;
  transform:translateX(-50%);
  width:15%;
  aspect-ratio:1;
  min-width:54px;
  min-height:54px;
  max-width:76px;
  max-height:76px;
  border-radius:50%;
  background:#ffca05;
  box-shadow:0 0 0 clamp(7px,1.3vw,9px) #fff2c7;
  display:flex;align-items:center;justify-content:center;
}
.warning span{
  color:#fff;
  font-size:clamp(40px,7vw,52px);
  font-weight:700;
  line-height:1;
  transform:translateY(-2px);
}
.code{
  position:absolute;
  left:8.7%;
  top:51.5%;
  margin:0;
  font-size:clamp(16px,3vw,21px);
  line-height:1;
  color:#171717;
  font-weight:400;
  letter-spacing:.1px;
}
.ok{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  bottom:10.5%;
  width:40%;
  min-width:150px;
  max-width:200px;
  height:19%;
  min-height:48px;
  max-height:61px;
  border:0;
  border-radius:clamp(10px,1.8vw,13px);
  background:#ffca05;
  color:#111;
  font-size:clamp(18px,3.1vw,22px);
  font-weight:500;
  cursor:pointer;
}
.ok:active{transform:translateX(-50%) scale(.98)}
</style>
</head>
<body>
<main class="app">
  <section class="panel" id="panel">
    <div class="warning" aria-hidden="true"><span>!</span></div>
    <div class="code">133197</div>
    <button class="ok" id="ok">Ok</button>
  </section>
</main>
<script>
document.getElementById("ok").addEventListener("click",()=>{
  window.close();
  setTimeout(()=>{ location.replace("about:blank"); },250);
});
if("serviceWorker" in navigator){
 addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
</body>
</html>
